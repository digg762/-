<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lootly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout concept: dark storefront shell, sticky top bar, tile grid of games, PS-Store style game band with filters + offer list below. */
:root{
  --bg:#090911; --surface:#12121e; --surface-2:#1a1a2a; --surface-3:#242439; --line:#2a2a40;
  --fg:#eef0fc; --muted:#9b9db8;
  --blue:#4da3ff; --violet:#9a5cff;
  --grad:linear-gradient(100deg,var(--blue),var(--violet));
  --on-grad:#07070f;
  --good:#3ddc97; --warn:#ffb547; --bad:#ff5d73;
  --shadow:0 14px 40px rgba(0,0,0,.45);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4fb; --surface:#ffffff; --surface-2:#eef0fa; --surface-3:#e2e5f5; --line:#d9dcee;
    --fg:#14152a; --muted:#5b5e80;
    --blue:#2a74d8; --violet:#7438e8; --on-grad:#ffffff;
    --good:#0f9a63; --warn:#b36c00; --bad:#d6304a;
    --shadow:0 14px 36px rgba(40,44,90,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4fb; --surface:#ffffff; --surface-2:#eef0fa; --surface-3:#e2e5f5; --line:#d9dcee;
  --fg:#14152a; --muted:#5b5e80;
  --blue:#2a74d8; --violet:#7438e8; --on-grad:#ffffff;
  --good:#0f9a63; --warn:#b36c00; --bad:#d6304a;
  --shadow:0 14px 36px rgba(40,44,90,.14);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#090911; --surface:#12121e; --surface-2:#1a1a2a; --surface-3:#242439; --line:#2a2a40;
  --fg:#eef0fc; --muted:#9b9db8;
  --blue:#4da3ff; --violet:#9a5cff; --on-grad:#07070f;
  --good:#3ddc97; --warn:#ffb547; --bad:#ff5d73;
  --shadow:0 14px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1360px;margin-inline:auto;padding-inline:16px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-body);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1;border:0;background:none;padding:2px 0;cursor:pointer}
.nav-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.nav-tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap}
.nav-tabs button[aria-current="page"]{background:var(--surface-3);color:var(--fg)}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:560px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 40px;outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:min(70vh,420px);overflow:auto;z-index:40}
.pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:10px}
.pop button:hover,.pop button:focus-visible{background:var(--surface-2)}
.pop .tile-sm{width:34px;height:34px;border-radius:10px;font-size:12px}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:19px;height:19px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding-inline:5px;border-radius:9px;background:var(--grad);color:var(--on-grad);font-size:11px;font-weight:700;display:grid;place-items:center}
.avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-weight:700;color:#fff;border:0;flex:none}
.avatar.lg{width:84px;height:84px;font-size:32px;font-family:var(--f-display)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:9px 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--grad);color:var(--on-grad);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--on-grad);border-color:transparent;font-weight:600}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scroll-x>*{flex:none}

/* ---------- generated art tiles ---------- */
.tile{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:24%;color:#fff;font-family:var(--f-display);font-weight:700;overflow:hidden;text-shadow:0 2px 10px rgba(0,0,0,.35);isolation:isolate}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.28),transparent 55%);z-index:-1}
.tile-sm{font-size:12px}
.new-tag{z-index:2;position:absolute;top:6px;right:6px;background:var(--good);color:#04130c;font-family:var(--f-body);font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;text-shadow:none}

/* ---------- home ---------- */
.page{padding-block:22px 24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:26px 14px}
.sec-head h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:20px 10px}
.game{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;border-radius:16px;min-width:0}
.game:hover .tile{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.game .tile{width:100%;max-width:92px;transition:transform .15s,box-shadow .15s;font-size:24px}
.game .nm{font-size:13px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.hero-line{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero-line h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,36px);letter-spacing:-.02em}
.demo-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

/* ---------- bottom nav (phone) ---------- */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
.bnav button[aria-current="page"]{color:var(--fg)}
.bnav svg{width:21px;height:21px}
@media (max-width:760px){
  .bnav{display:flex}
  .nav-tabs{display:none}
  .hdr-actions .hide-m{display:none}
  .logo{font-size:24px}
  .search{order:5;flex-basis:100%;max-width:none}
}

/* ---------- game page ---------- */
.gh{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;isolation:isolate;background:#10101c}
.gh-art{position:absolute;inset:-40px;z-index:-1;filter:blur(36px) saturate(1.3);opacity:.75}
.gh-veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,16,.2),rgba(8,8,16,.72))}
.gh-in{display:flex;gap:22px;align-items:flex-end;padding-block:26px 20px;flex-wrap:wrap}
.gh .tile{width:116px;font-size:38px;box-shadow:0 16px 40px rgba(0,0,0,.45);flex:none}
.gh-txt{flex:1 1 260px;min-width:0}
.gh-title{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.4vw,38px);letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.35);color:#fff}
.gh-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gh-meta .pill{background:rgba(10,10,20,.55);color:#fff;border-color:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.gh-act{display:flex;gap:8px;align-items:center}
.back{border:0;background:none;color:var(--muted);padding:0;font-weight:600;margin-block:14px 0;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--fg)}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.cat-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;color:var(--muted)}
.cat-tabs button[aria-selected="true"]{background:var(--surface-3);color:var(--fg);border-color:var(--blue)}
.cat-tabs .cnt{margin-left:6px;font-size:12px;opacity:.75}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;padding-block:18px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:16px}
.fpanel h3{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.fg{display:flex;flex-direction:column;gap:8px}
.fg>label,.fg>.lbl{font-weight:600;font-size:14px}
.fg select,.fg input[type="number"],.fg input[type="text"]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--violet)}
.f-toggle{display:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px;min-width:0}
.toolbar input,.toolbar select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.offers{display:flex;flex-direction:column;gap:10px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;align-items:center}
.offer:hover{border-color:color-mix(in srgb,var(--violet) 60%,var(--line))}
.offer h3{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.offer .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--surface-3);color:var(--muted);font-weight:500}
.tag.good{color:var(--good)}
.seller{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.price-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;grid-row:1/3;grid-column:2}
.price{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.old{text-decoration:line-through;color:var(--muted);font-size:13px;font-weight:500;margin-right:6px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .fpanel{position:static}
  .fpanel[data-open="false"]{display:none}
  .f-toggle{display:inline-flex}
}
@media (max-width:520px){
  .offer{grid-template-columns:minmax(0,1fr)}
  .price-col{grid-row:auto;grid-column:auto;flex-direction:row;align-items:center;justify-content:space-between;margin-top:6px}
  .gh .tile{width:84px;font-size:28px}
}

/* ---------- shop ---------- */
.shop-hero{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.feat{position:relative;border-radius:22px;overflow:hidden;min-height:230px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;color:#fff;border:0;text-align:left;isolation:isolate}
.feat:first-child{min-height:300px}
.feat .mono{position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-weight:700;font-size:140px;opacity:.18;z-index:-1;line-height:1}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.6));z-index:-1}
.feat h3{font-family:var(--f-display);font-size:clamp(18px,2.4vw,26px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.feat .pill{background:rgba(10,10,20,.55);color:#fff;border-color:rgba(255,255,255,.2);align-self:flex-start}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 14px}
.poster{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0}
.poster .art{position:relative;aspect-ratio:3/4;border-radius:18px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:44px;overflow:hidden;isolation:isolate;transition:transform .15s,box-shadow .15s;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.poster .art::after{content:"";position:absolute;inset:0;background:radial-gradient(100% 60% at 30% 0%,rgba(255,255,255,.25),transparent 60%);z-index:-1}
.poster:hover .art{transform:translateY(-3px);box-shadow:var(--shadow)}
.poster .disc{z-index:2;position:absolute;left:8px;top:8px;background:var(--grad);color:var(--on-grad);font-family:var(--f-body);font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;text-shadow:none}
.poster .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .sub{font-size:12px;color:var(--muted)}
.poster .pr{font-weight:700;font-variant-numeric:tabular-nums}
.shop-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px}
@media (max-width:900px){
  .shop-hero{grid-template-columns:minmax(0,1fr)}
  .feat,.feat:first-child{min-height:190px}
  .shop-layout{grid-template-columns:minmax(0,1fr)}
}
.drawer-bg{position:fixed;inset:0;background:rgba(5,5,12,.6);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);height:100%;display:flex;flex-direction:column;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;overflow:auto}
.cart-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.cart-row .tile{width:48px;font-size:15px}

/* ---------- profile / settings ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.profile-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-top h1{font-family:var(--f-display);font-size:clamp(20px,3.4vw,28px);font-weight:700;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .d{font-size:13px;color:var(--muted)}
.toggle{position:relative;width:46px;height:26px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface-3);padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-checked="true"]{background:var(--grad);border-color:transparent}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-grad)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.form input,.form textarea,.form select,.sel{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:400}
.form textarea{min-height:84px;resize:vertical}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sub-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.hist{display:flex;flex-direction:column}
.hist .row .tile{width:42px;font-size:14px}
.hist .l{display:flex;gap:12px;align-items:center;min-width:0}
.hist .l>div{min-width:0}
.status{font-size:12px;border-radius:8px;padding:2px 8px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);font-weight:600}

/* ---------- modal, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,5,12,.65);z-index:70;display:grid;place-items:center;padding:16px}
.modal{width:min(480px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;width:fit-content;max-width:100%}
.seg button{border:0;background:none;padding:8px 18px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button[aria-current="page"]{background:var(--surface-3);color:var(--fg)}
.foot{padding-bottom:110px;color:var(--muted);font-size:13px}
.foot a{color:var(--blue)}
.modal .tile{width:64px;font-size:22px;flex:none}
.modal h2{font-family:var(--f-display);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-block:6px;border-bottom:1px dashed var(--line)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--surface-3);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hdr"><div class="wrap hdr-in" id="hdr"></div></header>

  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);

  for (const k of Object.keys(extra)) {
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) out[k] = deepMerge(base[k], extra[k]);
    else out[k] = extra[k];
  }
  return out;
}

  else if (R.group !== 'all' && !R.q.trim()) list = list.filter(g => grp(g) === R.group);
  const showRail = !R.q && R.group === 'all';
  const pop = (isApp ? POPULAR_APPS : POPULAR).map(n => GAMES.find(g => g.name === n)).filter(Boolean);
  const rail = showRail ? `<div class="sec-head"><h2>Популярное сегодня</h2></div><div class="rail">${pop.map(gameBtn).join('')}</div>` : '';

    ${list.length ? `<div class="game-grid">${list.map(gameBtn).join('')}</div>` : `<div class="empty">${empty}</div>`}`;
}

function renderCats() {

function renderFilters() {

    return `<label class="check"><input type="checkbox" data-fc="${f.id}" ${R.fv[f.id] ? 'checked' : ''}> ${f.label}</label>`;
  }).join('') + `<div class="fg"><label for="fmax">Цена до, ${SYM[S.currency]}</label><input id="fmax" type="number" min="0" inputmode="numeric" placeholder="Без ограничения" value="${esc(R.maxPrice)}"></div>
  <button class="btn sm" data-act="freset">Сбросить фильтры</button>`;
}
function getOffer(id) { const [gid, cat, i] = id.split(':'); return offersFor(GAMES[+gid], cat)[+i]; }
function filteredOffers() {
  const g = GAMES[R.gid], rate = (CUR[S.currency] || CUR.RUB).rate, q = R.gq.trim().toLowerCase();
  let l = offersFor(g, R.cat).filter(o => {
    for (const [k, v] of Object.entries(R.fv)) { if (v === true && !o.attrs[k]) return false; if (typeof v === 'string' && v && o.attrs[k] !== v) return false; }
    if (R.maxPrice !== '' && o.price * rate > +R.maxPrice) return false;
    if (q && !o.title.toLowerCase().includes(q) && !o.seller.name.toLowerCase().includes(q)) return false;
    return true;
  });
  const s = { pop: (a, b) => b.sold - a.sold, asc: (a, b) => a.price - b.price, desc: (a, b) => b.price - a.price, rate: (a, b) => b.seller.rating - a.seller.rating }[R.sort];
  return l.sort(s);
}
function renderOffers() {

    return `<article class="offer">

        <div class="tags">${tags}<span class="tag ${o.delivery === 'Автовыдача' ? 'good' : ''}">${o.delivery}</span>${o.verified ? '<span class="tag good">Проверен</span>' : ''}</div>
        <div class="seller"><span class="dot ${o.online ? 'on' : ''}"></span><b style="color:var(--fg)">${esc(o.seller.name)}</b><span class="num">★ ${o.seller.rating}</span><span class="num">${o.seller.deals.toLocaleString('ru-RU')} сделок</span></div></div>

    <div class="card"><h2 style="font-family:var(--f-display);font-size:16px;margin-bottom:6px">Внешний вид и регион</h2>
      <div class="row"><div><div class="t">Тема</div><div class="d">Системная следует настройкам устройства</div></div><div class="chips">${[['system', 'Системная'], ['dark', 'Тёмная'], ['light', 'Светлая']].map(([k, l]) => `<button class="chip" data-theme-set="${k}" aria-pressed="${S.theme === k}">${l}</button>`).join('')}</div></div>
      <div class="row"><div><div class="t">Валюта цен</div><div class="d">Цены пересчитываются по примерному курсу</div></div><select class="sel" id="set-cur">${Object.keys(CUR).map(c => `<option ${c === S.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>
    <div class="card"><h2 style="font-family:var(--f-display);font-size:16px;margin-bottom:6px">Уведомления</h2>
      ${tgl('notif.orders', S.notif.orders, 'Статусы заказов', 'Оплата, выдача, споры')}${tgl('notif.msgs', S.notif.msgs, 'Сообщения', 'Новые сообщения от продавцов и покупателей')}${tgl('notif.deals', S.notif.deals, 'Скидки и акции', 'Подборки раз в неделю')}</div>
    <div class="card"><h2 style="font-family:var(--f-display);font-size:16px;margin-bottom:6px">Безопасность и приватность</h2>
      ${tgl('twofa', S.twofa, 'Двухфакторная защита', 'Код при входе с нового устройства')}${tgl('showOnline', S.showOnline, 'Показывать статус «онлайн»', 'Видят покупатели и продавцы')}
      <div class="row"><div><div class="t">Сеансы</div><div class="d">Завершить вход на всех устройствах</div></div><button class="btn sm" data-act="logoutall">Выйти везде</button></div></div>
    <div class="card"><h2 style="font-family:var(--f-display);font-size:16px;margin-bottom:6px">Платежи</h2>
      <div class="row"><div><div class="t">Способ вывода средств</div><div class="d">Для продавцов</div></div><select class="sel" id="set-payout">${[['card', 'Банковская карта'], ['sbp', 'СБП'], ['wallet', 'Электронный кошелёк']].map(([k, l]) => `<option value="${k}" ${S.payout === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div class="card"><h2 style="font-family:var(--f-display);font-size:16px;margin-bottom:6px">Данные демо</h2>
      <div class="row"><div><div class="t">Сбросить всё</div><div class="d">Очистит профиль, избранное, корзину и покупки на этом устройстве</div></div><button class="btn sm danger" data-reset>Сбросить</button></div></div>
  </div>`;
}

/* ===== События ===== */
document.addEventListener('click', e => {
  const t = e.target, q = s => t.closest(s);
  if (!q('.search')) { const p = $('#spop'); if (p) p.hidden = true; }
  let el;
  if ((el = q('[data-kind]'))) { R.kind = el.dataset.kind; R.group = 'all'; R.q = ''; const gs = $('#gsearch'); if (gs) gs.value = ''; viewMarket(); return; }
  if ((el = q('[data-go]'))) { R.q = ''; if (el.dataset.kindBack) R.kind = el.dataset.kindBack; go(el.dataset.go); return; }
  if (t.matches('[data-close]') || q('[data-close-btn]')) { closeLayer(); return; }
  if ((el = q('[data-group]'))) { R.group = el.dataset.group; renderGroups(); renderHomeDyn(); return; }
  if ((el = q('[data-cat]'))) { R.cat = el.dataset.cat; R.fv = {}; R.maxPrice = ''; R.gq = ''; R.shown = 12; $('#gq').value = ''; renderCats(); renderFilters(); renderOffers(); return; }
  if ((el = q('[data-f]'))) { const k = el.dataset.f, v = el.dataset.v; R.fv[k] = R.fv[k] === v ? '' : v; R.shown = 12; renderFilters(); renderOffers(); return; }
  if ((el = q('[data-fav]'))) { const id = +el.dataset.fav, i = S.favs.indexOf(id); if (i < 0) S.favs.push(id); else S.favs.splice(i, 1); save(); viewGame(); toast(i < 0 ? 'Добавлено в избранное' : 'Убрано из избранного'); return; }
  if ((el = q('[data-buy]'))) { buyModal(el.dataset.buy); return; }
  if ((el = q('[data-pay]'))) {
    const o = getOffer(el.dataset.pay); if (S.balance < o.price) return;
    S.balance -= o.price; S.purchases.unshift({ t: o.title, p: o.price, d: new Date().toLocaleDateString('ru-RU'), k: 'market' }); save(); closeLayer(); renderHeader(); toast('Заказ оформлен (демо)'); return;
  }
  if (q('[data-topup]')) { S.balance += 1000; save(); closeLayer(); render(); toast('Баланс пополнен на 1 000 ₽ (демо)'); return; }
  if ((el = q('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'cart') cartDrawer();
    else if (a === 'ftoggle') { R.fopen = !R.fopen; $('#fpanel').setAttribute('data-open', R.fopen); }
    else if (a === 'freset') { R.fv = {}; R.maxPrice = ''; R.shown = 12; renderFilters(); renderOffers(); }
    else if (a === 'more') { R.shown += 12; renderOffers(); }
    else if (a === 'sreset') { R.shopGenre = 'Все'; R.shopPlat = ''; R.shopSale = false; R.shopMax = ''; renderShopFilters(); renderShopGrid(); }
    else if (a === 'logoutall') toast('Демо: сеансы завершены');
    return;
  }
  if ((el = q('[data-shop]'))) { shopModal(+el.dataset.shop); return; }
  if ((el = q('[data-cartadd]'))) { const id = +el.dataset.cartadd; if (!S.cart.includes(id)) S.cart.push(id); save(); closeLayer(); renderHeader(); toast('Добавлено в корзину'); return; }
  if ((el = q('[data-cartrm]'))) { S.cart = S.cart.filter(i => i !== +el.dataset.cartrm); save(); renderHeader(); cartDrawer(); return; }
  if (q('[data-checkout]')) {
    const items = S.cart.map(i => SHOP[i]), total = items.reduce((s, x) => s + shopPrice(x), 0); if (S.balance < total) return;
    S.balance -= total; const d = new Date().toLocaleDateString('ru-RU'); items.forEach(x => S.purchases.unshift({ t: x.name, p: shopPrice(x), d, k: 'shop' })); S.cart = []; save(); closeLayer(); render(); toast('Заказ оформлен (демо)'); return;
  }
  if ((el = q('[data-sg]'))) { R.shopGenre = el.dataset.sg; renderShopFilters(); renderShopGrid(); return; }
  if ((el = q('[data-sp]'))) { R.shopPlat = R.shopPlat === el.dataset.sp ? '' : el.dataset.sp; renderShopFilters(); renderShopGrid(); return; }
  if ((el = q('[data-theme-set]'))) { S.theme = el.dataset.themeSet; save(); applyTheme(); viewSettings(); return; }
  if ((el = q('[data-tg]'))) {
    const path = el.dataset.tg.split('.'); let o = S; while (path.length > 1) o = o[path.shift()]; o[path[0]] = !o[path[0]]; save(); viewSettings(); toast('Сохранено'); return;
  }
  if ((el = q('[data-ptab]'))) { readProfileForm(); R.ptab = el.dataset.ptab; viewProfile(); return; }
  if ((el = q('[data-sw]'))) { readProfileForm(); S.profile.color = +el.dataset.sw; save(); render(); return; }
  if (q('[data-saveprof]')) { readProfileForm(); save(); render(); toast('Профиль сохранён'); return; }
  if (q('[data-seller]')) { S.profile.seller = !S.profile.seller; save(); viewProfile(); return; }
  if ((el = q('[data-reset]'))) {
    if (el.dataset.sure) { try { localStorage.removeItem(LS_KEY); } catch (er) {} S = JSON.parse(JSON.stringify(DEFAULTS)); applyTheme(); render(); toast('Данные сброшены'); }
    else { el.dataset.sure = '1'; el.textContent = 'Точно сбросить?'; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gsearch') {
    R.q = t.value;
    if (R.route === 'market' || R.route === 'game') suggest(R.q); else { const p = $('#spop'); if (p) p.hidden = true; }
    if (R.route === 'market') renderHomeDyn(); else if (R.route === 'shop') renderShopGrid();
  } else if (t.id === 'gq') { R.gq = t.value; R.shown = 12; renderOffers(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'gsort') { R.sort = t.value; renderOffers(); }
  else if (t.id === 'fmax') { R.maxPrice = t.value; R.shown = 12; renderOffers(); }
  else if (t.dataset && t.dataset.fc) { R.fv[t.dataset.fc] = t.checked; R.shown = 12; renderOffers(); }
  else if (t.id === 'ssort') { R.shopSort = t.value; renderShopGrid(); }
  else if (t.id === 'smax') { R.shopMax = t.value; renderShopGrid(); }
  else if (t.id === 'ssale') { R.shopSale = t.checked; renderShopGrid(); }
  else if (t.id === 'set-cur') { S.currency = t.value; save(); render(); toast('Валюта изменена'); }
  else if (t.id === 'set-payout') { S.payout = t.value; save(); toast('Сохранено'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLayer(); const p = $('#spop'); if (p) p.hidden = true; } });
window.addEventListener('popstate', () => apply(location.hash));
window.addEventListener('hashchange', () => apply(location.hash));

/* ===== Старт ===== */
applyTheme();
apply(location.hash);
try { fetch('covers.json').then(r => r.ok ? r.json() : {}).then(j => { if (j && Object.keys(j).length) { COVERS = j; render(); } }).catch(() => {}); } catch (e) {}
</script>

</body>
